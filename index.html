<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>看折痕，找作品</title>
<style>
  :root{--bg:#f4f1ea;--ink:#2b3138;--muted:#6b7480;--red:#a8433a;--kraft:#b98a5a;
        --line:#d8cfc0;--white:#fffdf8;--green:#4f7a52}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 70px}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
  h1{font-family:Georgia,serif;font-size:34px;margin:10px 0 6px}
  .lede{color:var(--muted);font-size:14px;line-height:1.65}
  .panel{background:var(--white);border:1px solid var(--line);padding:16px;margin-top:16px}
  .cpbox{background:#fff;border:1px solid var(--line);height:320px;display:flex;align-items:center;
         justify-content:center;overflow:hidden;position:relative}
  .cpbox img{max-width:100%;max-height:100%;object-fit:contain}
  .cpbox.t2 img{filter:grayscale(1) contrast(2.4) brightness(1.04)}
  .cpbox.t3 img{position:absolute;max-width:none;max-height:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .opt{border:1px solid var(--line);background:var(--white);padding:0;cursor:pointer;position:relative;
       aspect-ratio:1/1;overflow:hidden}
  .opt img{width:100%;height:100%;object-fit:cover;display:block}
  .opt:hover{border-color:var(--kraft)}
  .opt.right{outline:3px solid #4f7a52;outline-offset:-3px}
  .opt.wrong{outline:3px solid #a8433a;outline-offset:-3px;opacity:.6}
  .opt span{position:absolute;left:0;right:0;bottom:0;background:rgba(244,241,234,.9);
            font-size:11px;color:var(--muted);padding:2px 4px;text-align:center;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button.btn{font:inherit;font-size:15px;padding:12px 18px;border:1px solid var(--ink);
             background:transparent;cursor:pointer}
  button.btn.primary{background:var(--ink);color:var(--bg)}
  .msg{margin-top:12px;font-size:14px;line-height:1.7;color:var(--muted);min-height:24px}
  .msg b{color:var(--ink)}
  .small{font-size:11px;color:#a99f90;line-height:1.7;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>CREASE → OBJECT</span><span id="progress"></span></div>
  <h1>看折痕，找作品</h1>
  <div class="lede">上面是一张折痕图，下面九件作品里，只有一件是它折出来的。</div>

  <div class="panel" id="intro">
    <div class="lede" style="margin-bottom:12px">先选难度，再开始。一共五题，每题 20 分。</div>
    <div class="row">
      <button class="btn" data-tier="1">一档 · 完整折痕</button>
      <button class="btn" data-tier="2">二档 · 无色线条</button>
      <button class="btn" data-tier="3">三档 · 只给一块</button>
    </div>
    <div class="msg" id="introMsg">二档去掉颜色；三档只露一大块，可能是中间、四角或四边。</div>
  </div>

  <div class="panel" id="game" hidden>
    <div class="cpbox" id="cpbox"><img id="cp" alt="crease pattern"></div>
    <div class="grid" id="choices"></div>
    <div class="msg" id="msg">选一件你认为对的作品。</div>
    <div class="row" id="rowNext" hidden>
      <button class="btn primary" id="next">下一题</button>
    </div>
  </div>

  <div class="small">
    素材来自 Kei Morisue 的 Crease Pattern Gallery（© Kei Morisue 2024），此处仅作个人娱乐与学习之用。<br>
    折痕图与成品照片由作者公开分享，版权归原作者所有。
  </div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var BASE_CP = 'https://kei-morisue.github.io/CreasePatterens/PNG_format/';
  var BASE_PIC = 'https://kei-morisue.github.io/CreasePatterens/pics/';

  var MODELS = [
    { cp: '2018-11-03_cp_waterdrop_cp.png', pic: '2018-11-03_cp_waterdrop.jpg', name: '水滴' },
    { cp: '2018-10-17_cp_dodecahedoron_cp.png', pic: '2018-10-17_cp_dodecahedoron.jpg', name: '十二面体' },
    { cp: '2019-01-05_cp_akitsu_maru (4)_cp.png', pic: '2019-01-05_cp_akitsu_maru (4).jpg', name: '秋津丸' },
    { cp: '2019-03-11_cp_torus_hex_cp.png', pic: '2019-03-11_cp_torus_hex.jpg', name: '六角环' },
    { cp: '2019-07-16_cp_koubako_cp.png', pic: '2019-07-16_cp_koubako.jpg', name: '香箱' },
    { cp: '2020-04-14_cp_clock_cp.png', pic: '2020-04-14_cp_clock.jpg', name: '时钟' },
    { cp: '2021-03-01_cp_book_cp.png', pic: '2021-03-01_cp_book.jpg', name: '书' },
    { cp: '2021-03-01_cp_ring_cp.png', pic: '2021-03-01_cp_ring.jpg', name: '戒指' },
    { cp: '2021-02-06_cp_drip_cp.png', pic: '2021-02-06_cp_drip.jpg', name: '滴落' },
    { cp: '2018-10-26_cp_kitsune_cp.png', pic: '2018-10-26_cp_kitsune.jpg', name: '狐' },
    { cp: '2019-07-02_cp_fox_cp.png', pic: '2019-07-02_cp_fox.jpg', name: '狐狸' },
    { cp: '2020-06-18_cp_cheems_cp.png', pic: '2020-06-18_cp_cheems.jpg', name: 'cheems' }
  ];

  var state = { tier: 0, round: 0, score: 0, answer: null, locked: false };
  var TOTAL = 5;

  function url(base, name){ return base + encodeURIComponent(name).replace(/%2F/g, '/'); }

  function shuffle(a){
    var b = a.slice();
    for(var i = b.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }

  function start(tier){
    state = { tier: tier, round: 0, score: 0, answer: null, locked: false };
    $('intro').hidden = true;
    $('game').hidden = false;
    nextRound();
  }

  function nextRound(){
    state.round++;
    state.locked = false;
    $('rowNext').hidden = true;
    $('msg').textContent = '选一件你认为对的作品。';
    $('progress').textContent = '第 ' + state.round + ' / ' + TOTAL + ' 题 · ' + state.score + ' 分';

    var answer = MODELS[Math.floor(Math.random() * MODELS.length)];
    state.answer = answer;

    var cpbox = $('cpbox');
    cpbox.className = 'cpbox' + (state.tier === 2 ? ' t2' : state.tier === 3 ? ' t3' : '');
    var cp = $('cp');
    cp.removeAttribute('style');
    cp.style.visibility = 'hidden';
    cp.onload = function(){
      cp.style.visibility = 'visible';
      if(state.tier === 3) window.requestAnimationFrame(function(){ layoutZoom(cp); });
    };
    cp.onerror = function(){ $('msg').textContent = '折痕图没加载出来，检查一下网络。'; };
    cp.src = url(BASE_CP, answer.cp);

    var others = shuffle(MODELS.filter(function(m){ return m !== answer; })).slice(0, 8);
    var options = shuffle([answer].concat(others));

    var box = $('choices');
    box.innerHTML = '';
    options.forEach(function(m){
      var b = document.createElement('button');
      b.className = 'opt';
      b.setAttribute('data-name', m.name);
      b.innerHTML = '<img alt="" loading="lazy" src="' + url(BASE_PIC, m.pic) + '">' +
                    '<span>' + m.name + '</span>';
      b.addEventListener('click', function(){ choose(b, m, answer); });
      box.appendChild(b);
    });
  }

  // 第三档：放大后只露一大块，位置随机（中间 / 四角 / 四边）
  function layoutZoom(img){
    var box = $('cpbox');
    var cw = box.clientWidth, ch = box.clientHeight;
    var nw = img.naturalWidth, nh = img.naturalHeight;
    if(!nw || !nh) return;
    var zoom = 1.55;
    var w = cw * zoom;
    var h = nh * (w / nw);
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    var maxX = Math.max(0, w - cw);
    var maxY = Math.max(0, h - ch);
    var spots = [
      [0.5, 0.5],
      [0, 0], [1, 0],
      [0, 1], [1, 1],
      [0.5, 0], [0.5, 1],
      [0, 0.5], [1, 0.5]
    ];
    var s = spots[Math.floor(Math.random() * spots.length)];
    img.style.left = (-maxX * s[0]) + 'px';
    img.style.top = (-maxY * s[1]) + 'px';
  }

  function choose(btn, picked, answer){
    if(state.locked) return;
    state.locked = true;
    var ok = picked === answer;
    if(ok) state.score += 20;
    btn.classList.add(ok ? 'right' : 'wrong');
    if(!ok){
      var nodes = $('choices').querySelectorAll('.opt');
      for(var i = 0; i < nodes.length; i++){
        if(nodes[i].getAttribute('data-name') === answer.name){ nodes[i].classList.add('right'); }
      }
    }
    $('msg').innerHTML = ok
      ? '<b>对。</b>这是「' + answer.name + '」。'
      : '<b>不对。</b>正确答案是「' + answer.name + '」，绿框那件。';
    $('progress').textContent = '第 ' + state.round + ' / ' + TOTAL + ' 题 · ' + state.score + ' 分';

    if(state.round >= TOTAL){
      $('msg').innerHTML += '<br><b>五题结束，得分 ' + state.score + ' / 100。</b>';
      $('rowNext').hidden = false;
      $('next').textContent = '再玩一次';
    } else {
      $('rowNext').hidden = false;
    }
  }

  $('next').addEventListener('click', function(){
    if(state.round >= TOTAL){
      $('game').hidden = true;
      $('intro').hidden = false;
      $('progress').textContent = '';
      $('introMsg').textContent = '再选一次难度。';
      $('next').textContent = '下一题';
    } else {
      nextRound();
    }
  });

  document.querySelectorAll('[data-tier]').forEach(function(b){
    b.addEventListener('click', function(){ start(Number(b.getAttribute('data-tier'))); });
  });
})();
</script>
</body>
</html>
